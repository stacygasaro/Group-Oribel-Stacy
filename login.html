<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Software Development Basics - Practice Page</title>
</head>
<body>

  <header>
    <h1>Software Development Basics</h1>
    <nav>
      <a href="index.html">Home</a> |
      <a href="page2.html">Practice Page</a>
    </nav>
  </header>

  <hr>

  <main>
    <h2>Practice Page: Tables and Forms</h2>

    <!-- A table -->
    <h3>Course Schedule</h3>
    <table border="1" cellpadding="5">
      <thead>
        <tr>
          <th>Week</th>
          <th>Topic</th>
          <th>Tool</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>HTML basics</td>
          <td>Text editor</td>
        </tr>
        <tr>
          <td>2</td>
          <td>CSS styling</td>
          <td>Browser DevTools</td>
        </tr>
        <tr>
          <td>3</td>
          <td>JavaScript</td>
          <td>Console</td>
        </tr>
      </tbody>
    </table>

    <!-- A form -->
    <h3>Student Registration Form</h3>
    <form action="#" method="post">
      <p>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name">
      </p>

      <p>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email">
      </p>

      <p>
        <label for="level">Level:</label><br>
        <select id="level" name="level">
          <option>Beginner</option>
          <option>Intermediate</option>
          <option>Advanced</option>
        </select>
      </p>

      <p>
        <input type="checkbox" id="agree" name="agree">
        <label for="agree">I want to receive course updates</label>
      </p>

      <p>
        <button type="submit">Register</button>
      </p>
    </form>

    <p><a href="index.html">&larr; Back to Home</a></p>
  </main>

  <hr>

  <footer>
    <p>Example page for students &copy; 2026</p>
  </footer>

</body>
</html>
